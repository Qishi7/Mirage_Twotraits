name: R software tests
on:
  push:
    paths: ['R/**', 'mmirage/**', 'tests/**', '.github/workflows/r-tests.yml']
  pull_request:
    paths: ['R/**', 'mmirage/**', 'tests/**', '.github/workflows/r-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: mmirage
          extra-packages: any::rcmdcheck
          needs: check
      - name: Check source mirrors and repository tests
        shell: Rscript {0}
        run: |
          stopifnot(identical(readLines("R/two_trait_mirage.R"),
                              readLines("mmirage/R/two_trait_mirage.R")))
          source("tests/testthat.R")
      - name: Check installable package
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck("mmirage", args = "--no-manual", error_on = "warning")
